# OWASP ZAP для локальной разработки.
# API доступен только с этой машины и защищён ключом ZAP_API_KEY из файла .env.
services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: security-scanner-zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:?Set ZAP_API_KEY in .env}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "127.0.0.1:8090:8090"
    # Проверка из образа обращается к API без ключа и всегда показывает unhealthy.
    healthcheck:
      disable: true
