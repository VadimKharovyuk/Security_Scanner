<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${asset.name}">Актив</title>
</head>
<body>
	<header>
		<h1 th:text="${asset.name}">Актив</h1>
		<p>
			<a th:href="@{/projects/{id}(id=${project.id})}" th:text="'← К проекту ' + ${project.name}">← К проекту</a>
		</p>
	</header>

	<main>
		<dl>
			<dt>ID</dt>
			<dd th:text="${asset.id}">1</dd>

			<dt>URL</dt>
			<dd th:text="${asset.baseUrl}">https://example.com</dd>

			<dt>Проект</dt>
			<dd th:text="${project.name}">Проект</dd>

			<dt>Активен</dt>
			<dd th:text="${asset.active ? 'Да' : 'Нет'}">Да</dd>

			<dt>Статус владения</dt>
			<dd th:text="${asset.ownershipStatus}">NOT_REQUIRED</dd>

			<dt>Создан</dt>
			<dd th:text="${asset.createdAt}">2026-01-01</dd>

			<dt>Обновлён</dt>
			<dd th:text="${asset.updatedAt}">2026-01-01</dd>
		</dl>

		<form th:if="${asset.active}" th:action="@{/assets/{id}/deactivate(id=${asset.id})}" method="post">
			<button type="submit">Деактивировать</button>
		</form>

		<form th:action="@{/assets/{id}/delete(id=${asset.id})}" method="post"
			  onsubmit="return confirm('Удалить актив?')">
			<button type="submit">Удалить</button>
		</form>

		<h2>Сканирования</h2>
		<form th:if="${asset.active}" th:action="@{/assets/{id}/scans(id=${asset.id})}" method="post">
			<button type="submit">Запустить сканирование</button>
		</form>

		<table border="1" cellpadding="6" cellspacing="0">
			<thead>
				<tr>
					<th>ID</th>
					<th>Статус</th>
					<th>Создан</th>
					<th>Завершён</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="scan : ${scans}">
					<td>
						<a th:href="@{/scans/{id}(id=${scan.id})}" th:text="${scan.id}">1</a>
					</td>
					<td th:text="${scan.status}">QUEUED</td>
					<td th:text="${scan.createdAt}">2026-01-01</td>
					<td th:text="${scan.finishedAt != null ? scan.finishedAt : '—'}">—</td>
				</tr>
				<tr th:if="${#lists.isEmpty(scans)}">
					<td colspan="4">Сканирований пока нет</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
