<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${project.name}">Проект</title>
</head>
<body>
	<header>
		<h1 th:text="${project.name}">Проект</h1>
		<p><a th:href="@{/projects}">← К списку проектов</a></p>
	</header>

	<main>
		<dl>
			<dt>ID</dt>
			<dd th:text="${project.id}">1</dd>

			<dt>Описание</dt>
			<dd th:text="${project.description != null ? project.description : '—'}">Описание</dd>

			<dt>Создан</dt>
			<dd th:text="${project.createdAt}">2026-01-01</dd>

			<dt>Обновлён</dt>
			<dd th:text="${project.updatedAt}">2026-01-01</dd>
		</dl>

		<p>
			<a th:href="@{/projects/{id}/edit(id=${project.id})}">Изменить проект</a>
		</p>

		<h2>Активы</h2>
		<p><a th:href="@{/projects/{id}/assets/new(id=${project.id})}">+ Добавить актив</a></p>

		<table border="1" cellpadding="6" cellspacing="0">
			<thead>
				<tr>
					<th>ID</th>
					<th>Название</th>
					<th>URL</th>
					<th>Активен</th>
					<th>Владение</th>
					<th>Действия</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="asset : ${assets}">
					<td th:text="${asset.id}">1</td>
					<td>
						<a th:href="@{/assets/{id}(id=${asset.id})}" th:text="${asset.name}">Название</a>
					</td>
					<td th:text="${asset.baseUrl}">https://example.com</td>
					<td th:text="${asset.active ? 'Да' : 'Нет'}">Да</td>
					<td th:text="${asset.ownershipStatus}">NOT_REQUIRED</td>
					<td>
						<form th:if="${asset.active}" th:action="@{/assets/{id}/deactivate(id=${asset.id})}"
							  method="post" style="display:inline">
							<button type="submit">Деактивировать</button>
						</form>
						<form th:action="@{/assets/{id}/delete(id=${asset.id})}" method="post" style="display:inline"
							  onsubmit="return confirm('Удалить актив?')">
							<button type="submit">Удалить</button>
						</form>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(assets)}">
					<td colspan="6">Активов пока нет</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
