<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Проекты</title>
</head>
<body>
	<header>
		<h1>Проекты</h1>
		<p><a th:href="@{/}">На главную</a></p>
	</header>

	<main>
		<p><a th:href="@{/projects/new}">+ Добавить проект</a></p>

		<table border="1" cellpadding="6" cellspacing="0">
			<thead>
				<tr>
					<th>ID</th>
					<th>Название</th>
					<th>Описание</th>
					<th>Создан</th>
					<th>Действия</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="project : ${projects}">
					<td th:text="${project.id}">1</td>
					<td>
						<a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}">Название</a>
					</td>
					<td th:text="${project.description != null ? project.description : '—'}">Описание</td>
					<td th:text="${project.createdAt}">2026-01-01</td>
					<td>
						<a th:href="@{/projects/{id}/edit(id=${project.id})}">Изменить</a>
						<form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" style="display:inline"
							  onsubmit="return confirm('Удалить проект?')">
							<button type="submit">Удалить</button>
						</form>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(projects)}">
					<td colspan="5">Проектов пока нет</td>
				</tr>
			</tbody>
		</table>

		<nav>
			<a th:if="${hasPrev}" th:href="@{/projects(page=${page - 1})}">← Назад</a>
			<span th:text="'Страница ' + (${page} + 1)">Страница 1</span>
			<a th:if="${hasNext}" th:href="@{/projects(page=${page + 1})}">Вперёд →</a>
		</nav>
	</main>
</body>
</html>
